<main id="backend-main-content" class="container p-3 col-xl-10 offset-xl-1 col-12"><div id="planka-sync-page"><div id="planka-sync-content"><div class="d-flex justify-content-between align-items-center mb-2"><h1 class="mb-0">Pull Reviews</h1></div><p class="text-muted">Import the reviews that reviewers have moved to <em>Publish ready</em> on the board.</p><div class="row g-4 align-items-start"><div class="col-12" id="planka-main-column"><div id="planka-panel"><div class="card" id="planka-sync-panel" data-planka-disconnected="false" ><div class="card-header d-flex justify-content-between align-items-center"><span>Cards on the board</span></div><div class="card-body"><div class="alert alert-warning"> No Planka connection configured. Set one up in Settings. </div><div class="alert alert-info d-flex flex-wrap justify-content-between align-items-center gap-2 mb-0"><span>This issue has no Planka board yet.</span><a class="btn btn-sm btn-primary" href="/editorial/issues/builder?issue=31#planka-panel">Create it on the Setup tab</a></div></div></div><script> (() => { const panel = document.getElementById("planka-sync-panel"); if (!panel) return; const isDisconnected = panel.getAttribute("data-planka-disconnected") === "true"; const refreshUrl = panel.getAttribute("data-planka-refresh-url") || ""; const retryKey = "plankaReconnectAttempt"; if (!isDisconnected || !refreshUrl) { window.sessionStorage.removeItem(retryKey); return; } const attempt = Number(window.sessionStorage.getItem(retryKey) || "0"); const delayMs = Math.min(30000, Math.max(1000, Math.pow(2, attempt) * 1000)); window.sessionStorage.setItem(retryKey, String(attempt + 1)); window.setTimeout(() => { if (window.htmx) { window.htmx.ajax("GET", refreshUrl, { target: "#planka-sync-panel", swap: "outerHTML", }); } }, delayMs); })(); (() => { const panel = document.getElementById("planka-sync-panel"); if (!panel) return; const checkAll = panel.querySelector("#planka-check-all"); const cardChecks = panel.querySelectorAll(".planka-card-check"); if (checkAll) { checkAll.addEventListener("change", () => { cardChecks.forEach((checkbox) => { if (!checkbox.disabled) checkbox.checked = checkAll.checked; }); }); } const title = document.getElementById("planka-card-description-title"); const body = document.getElementById("planka-card-description-body"); panel.querySelectorAll(".js-planka-desc").forEach((button) => { button.addEventListener("click", () => { if (title) { title.textContent = button.getAttribute("data-card-name") || "Card description"; } if (body) { body.textContent = button.getAttribute("data-card-description") || "(No description)"; } }); }); })(); </script></div></div></div></div></div></main>
