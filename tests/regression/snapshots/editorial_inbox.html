<main id="backend-main-content" class="container p-3 col-xl-10 offset-xl-1 col-12"><div class="d-flex align-items-center justify-content-between mb-3"><h4 class="mb-0">Inbox</h4></div><div class="card border-0 bg-body-tertiary mb-3"><div class="card-body"><div class="row g-2 align-items-end"><div class="col-12 col-md"><label class="form-label small text-muted mb-1" for="inbox-search">Filter threads</label><input id="inbox-search" type="search" name="q" class="form-control" placeholder="Search by email or subject" value="" hx-get="/editorial/inbox/" hx-target="#inbox-thread-list" hx-trigger="input changed delay:250ms, search" hx-push-url="true" ></div><div class="col-12 col-md-auto"><form method="post" action="/editorial/inbox/mark-all-read" hx-post="/editorial/inbox/mark-all-read" hx-target="#inbox-thread-list" hx-include="#inbox-search" ><input type="hidden" name="csrfmiddlewaretoken" value="__CSRF__"><button type="submit" class="btn btn-outline-secondary w-100">Mark All as Read</button></form></div></div></div></div><div id="inbox-thread-list"><div class="text-center text-muted py-5"><p class="mb-0">No messages match this filter.</p></div></div></main>
