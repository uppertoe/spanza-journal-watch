exclude: '^docs/|/migrations/'
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: 'spanza_journal_watch/templates/'
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        args: ['--tab-width', '2', '--single-quote']
        # deploy/journalwatch is a byte-for-byte copy of the server repo; leave its formatting alone.
        exclude: 'spanza_journal_watch/templates/|tests/regression/snapshots/|package-lock.json|deploy/journalwatch/'

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.32.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  # Keep this pin in step with the ruff version in requirements/local.txt so
  # the hook, the container and CI agree on formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
