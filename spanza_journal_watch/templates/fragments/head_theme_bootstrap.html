{# Applies the chosen colour scheme before first paint, so pages never flash the wrong theme. No choice yet means Auto: follow the system. #}
<script>
      (() => {
        const storedTheme = localStorage.getItem('theme') || 'auto';
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = storedTheme === 'auto' ? (systemDark ? 'dark' : 'light') : storedTheme;
        document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
      })();
    </script>
