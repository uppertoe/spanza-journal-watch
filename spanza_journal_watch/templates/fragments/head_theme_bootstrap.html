{# Applies the stored or system colour scheme before first paint, so pages never flash the wrong theme. #}
<script>
      (() => {
        const storedTheme = localStorage.getItem('theme');
        const preferredTheme = storedTheme || (
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        );
        const resolvedTheme = preferredTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : preferredTheme;
        document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
      })();
    </script>
