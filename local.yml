volumes:
  spanza_journal_watch_local_postgres_data: {}
  spanza_journal_watch_local_postgres_data_backups: {}
  spanza_journal_watch_local_planka_data: {}
  spanza_journal_watch_local_planka_postgres_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: spanza_journal_watch_local_django
    container_name: spanza_journal_watch_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
      - mjml
    volumes:
      - .:/app:z
    env_file: .env.local
    ports:
      - '8033:8000'
    command: /start

  postgres:
    image: postgres:17
    container_name: spanza_journal_watch_local_postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=250ms
    volumes:
      - spanza_journal_watch_local_postgres_data:/var/lib/postgresql/data
      - spanza_journal_watch_local_postgres_data_backups:/backups
      - ./backups:/backups
      - ./deploy/journalwatch/postgres/init:/docker-entrypoint-initdb.d:ro
    env_file: .env.local

  docs:
    image: spanza_journal_watch_local_docs
    container_name: spanza_journal_watch_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file: .env.local
    profiles: ['tools']
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./spanza_journal_watch:/app/spanza_journal_watch:z
    ports:
      - '9000:9000'
    command: /start-docs

  mailpit:
    image: axllent/mailpit:latest
    container_name: spanza_journal_watch_local_mailpit
    ports:
      - '8025:8025'

  redis:
    image: redis:7
    container_name: spanza_journal_watch_local_redis

  celeryworker:
    <<: *django
    image: spanza_journal_watch_local_celeryworker
    container_name: spanza_journal_watch_local_celeryworker
    profiles: ['workers']
    depends_on:
      - redis
      - postgres
      - mailpit
      - mjml
    ports: []
    command: /start-celeryworker

  flower:
    <<: *django
    image: spanza_journal_watch_local_flower
    container_name: spanza_journal_watch_local_flower
    profiles: ['flower']
    ports:
      - '5555:5555'
    command: /start-flower

  node:
    build:
      context: .
      dockerfile: ./compose/local/node/Dockerfile
    image: spanza_journal_watch_local_node
    container_name: spanza_journal_watch_local_node
    depends_on:
      - django
    volumes:
      - .:/app:z
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - /app/node_modules
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    command: npm run dev
    ports:
      - '3000:3000'

  mjml:
    build:
      context: .
      dockerfile: ./compose/production/mjml-tcp/Dockerfile
    image: spanza_journal_watch_production_mjml
    container_name: spanza_journal_watch_local_mjml
    restart: always
    ports:
      - '28101:28101'
    command: ['--mjml.validationLevel=strict']

  # Planka signs in from the headers that a reverse proxy adds after asking
  # Django (spanza_journal_watch/backend/planka_gateway.py), so locally the
  # browser talks to planka_gateway on :3001, never to Planka itself. Keep the
  # digest in step with deploy/journalwatch/docker-compose.yml.
  planka:
    image: ghcr.io/uppertoe/kanban-gateway-signin:latest@sha256:d9d307576e1b38c0a9cb4fb2b3d962d47f2e2fe14dce04e2a136fcebfebb0897
    container_name: spanza_journal_watch_local_planka
    profiles: ['planka']
    restart: on-failure
    depends_on:
      planka_postgres:
        condition: service_healthy
    volumes:
      - spanza_journal_watch_local_planka_data:/app/data
      - ./deploy/journalwatch/planka/custom:/app/terms/custom:ro
    environment:
      BASE_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres@planka_postgres/planka
      SECRET_KEY: notsecretkey
      SWAGGER_EXPOSED: 'true'
      TRUST_PROXY: 'true'
      GATEWAY_AUTH: 'true'
      GATEWAY_AUTH_SECRET: local-planka-gateway-secret-not-for-production
      GATEWAY_ADMIN_GROUPS: planka-admins
      GATEWAY_BOARD_USER_GROUPS: planka-users
      # Signing out of Planka also signs out of Journal Watch, then returns here.
      GATEWAY_LOGOUT_URL: http://localhost:8000/accounts/logout/?next=/planka/
      DEFAULT_ADMIN_EMAIL: demo@demo.demo
      DEFAULT_ADMIN_PASSWORD: demo
      DEFAULT_ADMIN_NAME: Demo Demo
      DEFAULT_ADMIN_USERNAME: demo

  planka_gateway:
    image: caddy:2-alpine
    container_name: spanza_journal_watch_local_planka_gateway
    profiles: ['planka']
    restart: on-failure
    depends_on:
      - planka
    ports:
      - '3001:3001'
    volumes:
      - ./compose/local/planka_gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      PLANKA_GATEWAY_SECRET: local-planka-gateway-secret-not-for-production

  planka_postgres:
    image: postgres:16-alpine
    container_name: spanza_journal_watch_local_planka_postgres
    profiles: ['planka']
    restart: on-failure
    environment:
      POSTGRES_DB: planka
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - spanza_journal_watch_local_planka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d planka']
      interval: 10s
      timeout: 5s
      retries: 5
